<div class="container-fluid">
    <table mat-table [dataSource]="assetsWithHoldings" class="mat-elevation-z8">

        <!-- Asset Column -->
        <ng-container matColumnDef="assetCode">
            <th mat-header-cell *matHeaderCellDef i18n> Asset code </th>
            <td mat-cell *matCellDef="let element"> {{element.assetCode}} </td>
        </ng-container>

        <!-- Holdings Column -->
        <ng-container matColumnDef="holdings">
            <th mat-header-cell *matHeaderCellDef i18n> Holdings </th>
            <td mat-cell *matCellDef="let element"> {{element.holdings}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
