<div class="container-fluid">
    @if (!isLoading) {
    <table mat-table [dataSource]="portfolioRows" class="mat-elevation-z8">

        <!-- Asset Column -->
        <ng-container matColumnDef="assetId">
            <th mat-header-cell *matHeaderCellDef i18n> Asset </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} {{element.symbol}} </td>
        </ng-container>

        <!-- Price Column -->
        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef i18n> Price </th>
            <td mat-cell *matCellDef="let element"> {{element.price}} </td>
        </ng-container>

        <!-- Holdings Column -->
        <ng-container matColumnDef="holdings">
            <th mat-header-cell *matHeaderCellDef i18n> Holdings </th>
            <td mat-cell *matCellDef="let element">
                {{element.holdingsPrice}} - {{element.holdingsAmount}}
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    }
</div>
