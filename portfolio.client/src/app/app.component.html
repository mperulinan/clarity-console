<div class="container-fluid">
    @if (!isLoading) {

    <button mat-raised-button color="primary" (click)="openNewTransactionDialog()" i18n>Add transaction</button>

    <table mat-table [dataSource]="portfolioRows" class="mat-elevation-z8 mt-3">

        <!-- Asset Column -->
        <ng-container matColumnDef="assetId">
            <th mat-header-cell *matHeaderCellDef i18n> Asset </th>
            <td mat-cell *matCellDef="let element">
                <span class="fw-bold">{{element.name}}</span>
                {{element.symbol}}
            </td>
        </ng-container>

        <!-- Price Column -->
        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef i18n> Price </th>
            <td mat-cell *matCellDef="let element" class="fw-bold"> {{element.price}} </td>
        </ng-container>

        <!-- Holdings Column -->
        <ng-container matColumnDef="holdings">
            <th mat-header-cell *matHeaderCellDef i18n> Holdings </th>
            <td mat-cell *matCellDef="let element">
                <span class="fw-bold">${{element.holdingsPrice}}</span>
                <br>
                <span class="fs-7 text-secondary-emphasis">{{element.holdingsAmount}} {{element.symbol}}</span>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    }
</div>
