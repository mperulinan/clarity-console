<h1 mat-dialog-title i18n>Add transaction</h1>
<mat-dialog-content>
    <mat-card class="w-100 p-2 transaction-form-card">
        <form [formGroup]="form" (ngSubmit)="submit()">

            <!-- Step 1 -->
            <div *ngIf="step === 1">
                <ng-container [formGroup]="typeGroup">
                    <mat-button-toggle-group formControlName="type" class="w-100">
                        <mat-button-toggle *ngFor="let option of transactionTypeOptions" [value]="option.value"
                            class="w-100">
                            {{ option.label }}
                        </mat-button-toggle>
                    </mat-button-toggle-group>

                    <div class="datetime-container">
                        <input type="datetime-local" formControlName="date" class="datetime-input" step="1" />
                    </div>
                </ng-container>

                <ng-container [formGroup]="detailsGroup">
                    <ng-container [ngSwitch]="transactionType.value">
                        <ng-container *ngSwitchCase="TYPE_SWAP">
                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>From asset</mat-label>
                                <input matInput formControlName="fromAssetId" required />
                            </mat-form-field>

                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>To asset</mat-label>
                                <input matInput formControlName="toAssetId" required />
                            </mat-form-field>

                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>Amount spent</mat-label>
                                <input matInput formControlName="amountSpent" required />
                            </mat-form-field>

                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>Amount received</mat-label>
                                <input matInput formControlName="amountReceived" required />
                            </mat-form-field>

                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>From asset price (EUR) at date of "From asset"</mat-label>
                                <input matInput formControlName="fromAssetPriceInEur" required />
                            </mat-form-field>
                        </ng-container>

                        <ng-container *ngSwitchCase="TYPE_REWARD">
                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>Asset</mat-label>
                                <input matInput formControlName="rewardAsset" required />
                            </mat-form-field>

                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>Amount</mat-label>
                                <input matInput formControlName="rewardAmount" required />
                            </mat-form-field>

                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>Price (EUR) at date</mat-label>
                                <input matInput formControlName="rewardPriceEur" required />
                            </mat-form-field>
                        </ng-container>

                        <ng-container *ngSwitchCase="TYPE_TRANSFER">
                            <mat-form-field appearance="fill" class="w-full">
                                <mat-label i18n>Amount (EUR) at date</mat-label>
                                <input matInput formControlName="transferAmount" required />
                            </mat-form-field>
                        </ng-container>
                    </ng-container>

                    <button mat-button (click)="nextStep()" [disabled]="typeGroup.invalid || detailsGroup.invalid"
                        i18n>Next</button>
                </ng-container>
            </div>

            <!-- Step 2: Fees -->
            <ng-container [formGroup]="feeGroup" *ngIf="step === 2">
                <mat-form-field appearance="fill" class="w-full">
                    <mat-label i18n>Fee</mat-label>
                    <input matInput formControlName="fee" />
                </mat-form-field>

                <mat-form-field appearance="fill" class="w-full">
                    <mat-label i18n>Fee asset</mat-label>
                    <input matInput formControlName="feeAsset" />
                </mat-form-field>

                <mat-form-field appearance="fill" class="w-full">
                    <mat-label i18n>Fee asset price (EUR)</mat-label>
                    <input matInput formControlName="feeAssetPriceEur" />
                </mat-form-field>

                <button mat-button (click)="prevStep()">Back</button>
                <button mat-button (click)="nextStep()">Next</button>
            </ng-container>

            <!-- Step 3: Notes -->
            <ng-container [formGroup]="notesGroup" *ngIf="step === 3">
                <mat-form-field appearance="fill" class="w-full">
                    <mat-label i18n>Notes</mat-label>
                    <textarea matInput formControlName="notes" rows="3"></textarea>
                </mat-form-field>

                <button mat-button (click)="prevStep()">Back</button>
                <button mat-raised-button color="primary" type="submit">Save</button>
            </ng-container>
        </form>
    </mat-card>
</mat-dialog-content>
