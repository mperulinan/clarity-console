<div class="max-w-2xl mx-auto p-6">
    <mat-card class="bg-gray-800 text-white border-0 shadow-lg">
        <mat-card-header class="mb-4">
            <mat-card-title class="text-2xl">New Transaction</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

                <!-- Type & Date -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <mat-button-toggle-group formControlName="type" class="w-full">
                            @for (type of transactionTypes; track type.value) {
                            <mat-button-toggle [value]="type.value" class="flex-1">
                                {{ type.label }}
                            </mat-button-toggle>
                            }
                        </mat-button-toggle-group>
                    </div>
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="date">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>

                <!-- From Asset -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>From Asset (Sold)</mat-label>
                        <input matInput formControlName="fromAssetId" placeholder="e.g. USD, BTC">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Amount Spent</mat-label>
                        <input matInput type="number" formControlName="amountSpent">
                    </mat-form-field>
                </div>

                <!-- Price (The Key Feature) -->
                <div class="bg-gray-700 p-4 rounded">
                    <div class="flex items-center gap-2 mb-3 text-gray-300 text-sm">
                        <mat-icon class="text-base">info</mat-icon>
                        Price of the "From Asset" at that date
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <mat-form-field appearance="fill" class="w-full">
                            <mat-label>Price in USD ($)</mat-label>
                            <input matInput type="number" formControlName="fromAssetPriceInUsd"
                                placeholder="Will auto-convert to €">
                            <mat-hint class="text-blue-400">Recommended</mat-hint>
                        </mat-form-field>
                        <mat-form-field appearance="fill" class="w-full">
                            <mat-label>Price in EUR (€)</mat-label>
                            <input matInput type="number" formControlName="fromAssetPriceInEur"
                                placeholder="Optional override">
                        </mat-form-field>
                    </div>
                </div>

                <!-- To Asset -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>To Asset (Bought)</mat-label>
                        <input matInput formControlName="toAssetId" placeholder="e.g. BTC">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Amount Received</mat-label>
                        <input matInput type="number" formControlName="amountReceived">
                    </mat-form-field>
                </div>

                <!-- Fee -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                     <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Fee Amount</mat-label>
                        <input matInput type="number" formControlName="fee">
                    </mat-form-field>
                     <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Fee Asset</mat-label>
                        <input matInput formControlName="feeAsset" placeholder="e.g. USD">
                    </mat-form-field>
                     <mat-form-field appearance="fill" class="w-full">
                        <mat-label>Fee Price (USD)</mat-label>
                        <input matInput type="number" formControlName="feeAssetPriceInUsd" placeholder="Optional">
                    </mat-form-field>
                </div>

                <!-- Notes -->
                <mat-form-field appearance="fill" class="w-full">
                    <mat-label>Notes</mat-label>
                    <textarea matInput formControlName="notes" rows="2"></textarea>
                </mat-form-field>

                <!-- Actions -->
                <div class="flex justify-end gap-3 mt-4">
                    <button mat-button type="button" (click)="onCancel()" class="text-white">
                        Cancel
                    </button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting">
                        {{ isSubmitting ? 'Saving...' : 'Save Transaction' }}
                    </button>
                </div>

            </form>
        </mat-card-content>
    </mat-card>
</div>
