name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore src/Portfolio.API/Portfolio.API.csproj
    - name: Build
      run: dotnet build src/Portfolio.API/Portfolio.API.csproj --no-restore
    # Uncomment when tests are added
    # - name: Test
    #   run: dotnet test src/Portfolio.API/Portfolio.API.csproj --no-build --verbosity normal

  build-and-test-client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: 'src/Portfolio.Client/package-lock.json'
    - name: Install dependencies
      working-directory: ./src/Portfolio.Client
      run: npm ci
    - name: Build
      working-directory: ./src/Portfolio.Client
      run: npm run build
    # Uncomment when tests are ready (requires ChromeHeadless configuration in Karma/Vitest)
    # - name: Test
    #   working-directory: ./src/Portfolio.Client
    #   run: npm run test

  build-and-push-docker-images:
    needs: [build-and-test-api, build-and-test-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for API
      id: meta-api
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api

    - name: Build and push API Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Portfolio.API/Dockerfile
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}

    - name: Extract metadata (tags, labels) for Client
      id: meta-client
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client

    - name: Build and push Client Docker image
      uses: docker/build-push-action@v5
      with:
        context: src/Portfolio.Client
        file: src/Portfolio.Client/Dockerfile
        push: true
        tags: ${{ steps.meta-client.outputs.tags }}
        labels: ${{ steps.meta-client.outputs.labels }}
