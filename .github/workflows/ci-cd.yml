name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────
  # 1. Build & Test — .NET API (GitHub-hosted)
  # ─────────────────────────────────────────────
  build-and-test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/Portfolio.API/Portfolio.API.csproj

      - name: Build
        run: dotnet build src/Portfolio.API/Portfolio.API.csproj --no-restore

      - name: Test and Collect Coverage
        run: dotnet test Portfolio.slnx --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: code-coverage
          path: code-coverage-results.md

  # ─────────────────────────────────────────────
  # 2. Build & Test — Angular Client (GitHub-hosted)
  # ─────────────────────────────────────────────
  build-and-test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 'src/Portfolio.Client/package-lock.json'

      - name: Install dependencies
        working-directory: ./src/Portfolio.Client
        run: npm ci

      - name: Build
        working-directory: ./src/Portfolio.Client
        run: npm run build

      # Uncomment when tests are ready (requires ChromeHeadless configuration in Karma/Vitest)
      # - name: Test
      #   working-directory: ./src/Portfolio.Client
      #   run: npm run test

  # ─────────────────────────────────────────────
  # 3. Deploy to IIS — Self-hosted Windows runner
  # ─────────────────────────────────────────────
  deploy-to-iis:
    needs: [build-and-test-api, build-and-test-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    # Override the default PowerShell execution policy for every step in this job.
    # The runner machine may have Restricted/AllSigned policy which blocks .ps1 scripts.
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File {0}

    env:
      API_PUBLISH_DIR: publish\api
      CLIENT_DIST_DIR: src\Portfolio.Client\dist\portfolio.client\browser
      IIS_API_PATH: C:\inetpub\wwwroot\portfolio-api
      IIS_CLIENT_PATH: C:\inetpub\wwwroot\portfolio-client
      APP_POOL_API: PortfolioAPI
      APP_POOL_CLIENT: PortfolioClient

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── .NET API ──────────────────────────────
      - name: Publish API (Release)
        run: |
          dotnet publish src/Portfolio.API/Portfolio.API.csproj -c Release -o ${{ env.API_PUBLISH_DIR }}

      - name: Write production appsettings overrides
        # Injects secrets into appsettings.json inside the publish output.
        # The source appsettings.json in your repo is never modified.
        run: |
          $config = @{
            ConnectionStrings = @{
              Portfolio = "${{ secrets.DB_CONNECTION_STRING }}"
            }
            CoinGecko = @{
              BaseUrl = "https://api.coingecko.com/api/v3/"
              ApiKey  = "${{ secrets.COINGECKO_API_KEY }}"
            }
            TwelveData = @{
              BaseUrl = "https://api.twelvedata.com/"
              ApiKey  = "${{ secrets.TWELVEDATA_API_KEY }}"
            }
          }
          $config | ConvertTo-Json -Depth 5 |
            Set-Content -Path "${{ env.API_PUBLISH_DIR }}\appsettings.json" -Encoding UTF8

      - name: Stop IIS App Pool — API
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name "${{ env.APP_POOL_API }}").Value -eq "Started") {
            Stop-WebAppPool -Name "${{ env.APP_POOL_API }}"
            Start-Sleep -Seconds 3
          }

      - name: Deploy API to IIS
        run: |
          robocopy "${{ env.API_PUBLISH_DIR }}" "${{ env.IIS_API_PATH }}" /MIR /NP /NFL /NDL
          # robocopy exit codes 0-7 are success (0=no change, 1=copied, etc.)
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Start IIS App Pool — API
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "${{ env.APP_POOL_API }}"

      # ── Angular Client ────────────────────────
      - name: Install Client dependencies
        working-directory: ./src/Portfolio.Client
        run: npm ci

      - name: Build Angular Client (production)
        working-directory: ./src/Portfolio.Client
        run: npm run build

      - name: Stop IIS App Pool — Client
        run: |
          Import-Module WebAdministration
          if ((Get-WebAppPoolState -Name "${{ env.APP_POOL_CLIENT }}").Value -eq "Started") {
            Stop-WebAppPool -Name "${{ env.APP_POOL_CLIENT }}"
            Start-Sleep -Seconds 3
          }

      - name: Deploy Client to IIS
        run: |
          robocopy "${{ env.CLIENT_DIST_DIR }}" "${{ env.IIS_CLIENT_PATH }}" /MIR /NP /NFL /NDL
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Start IIS App Pool — Client
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "${{ env.APP_POOL_CLIENT }}"

      - name: Deployment summary
        run: |
          Write-Host "✅ API deployed to ${{ env.IIS_API_PATH }}"
          Write-Host "✅ Client deployed to ${{ env.IIS_CLIENT_PATH }}"
